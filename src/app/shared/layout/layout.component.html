  <aside class="sidebar" aria-label="Menú de operación">
    <div class="sidebar-heading"><strong>Precision Fleet</strong><span>Consola Central de Despacho</span></div>
    <a class="dispatch-action" routerLink="/ventas/nueva">＋ Generar venta</a>
    <nav aria-label="Módulos administrativos">
      <a routerLink="/dashboard" routerLinkActive="selected" ariaCurrentWhenActive="page"><span aria-hidden="true">▦</span>Dashboard</a>
      <a routerLink="/ventas" routerLinkActive="selected" ariaCurrentWhenActive="page"><span aria-hidden="true">$</span>Ventas</a>
      <a routerLink="/clientes" routerLinkActive="selected" ariaCurrentWhenActive="page"><span aria-hidden="true">♙</span>Clientes</a>
      <a routerLink="/buses" routerLinkActive="selected" ariaCurrentWhenActive="page"><span aria-hidden="true">▣</span>Buses</a>

      <a routerLink="/viajes" routerLinkActive="selected" ariaCurrentWhenActive="page"><span aria-hidden="true">↗</span>Viajes</a>

  <main class="main-content"><router-outlet></router-outlet></main>
